name: Auto Update Novel Index

on:
  push:
    paths:
      - '**/*.txt'
      - '**/封面.*'
      - 'generate_index.py'
    branches:
      - main

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate books.json
        run: |
          python3 generate_index.py

      - name: Commit and Push if books.json changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add books.json
          if git diff --staged --quiet; then
            echo "books.json 没有变化，无需提交。"
          else
            git commit -m "chore: 自动同步更新小说章节索引 [skip ci]"
            git push
          fi
