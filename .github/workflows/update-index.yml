name: Update Novel Index

on:
  push:
    branches:
      - main
    paths:
      - '**/*.txt'
      - '**/封面.*'
      - 'generate_index.py'
      - '.github/workflows/update-index.yml'
      - '.nojekyll'

permissions:
  contents: write

concurrency:
  group: update-novel-index
  cancel-in-progress: true

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate books.json
        run: python3 generate_index.py

      - name: Commit updated books.json
        run: |
          if git diff --quiet -- books.json; then
            echo "books.json is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add books.json
          git commit -m "chore: update novel index [skip ci]"
          git push
